name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          # every browser script, by glob — a new module must not be able to
          # skip this the way it could when the files were named one by one
          for f in app.js scripts/holosyn-*.js scripts/smoke-check.mjs eslint.config.mjs; do
            node --check "$f"
          done

      - name: Lint for undeclared identifiers
        run: npx --yes eslint@9 .

      - name: Run smoke check
        run: node scripts/smoke-check.mjs

      - name: Check launcher syntax
        run: bash -n "HOLOSYN 실행.command"
